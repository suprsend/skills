name: suprsend-workflows
description: >
  SuprSend workflow design, configuration, and triggering guide for AI agents.
  Use when building notification workflows, configuring workflow nodes like
  delay, batch, digest, or branch, or triggering notifications via API or SDK.
license: MIT
metadata:
  author: suprsend
  version: "1.0"
  category: workflows

sources:
  - type: static
    key: overview
    path: overview.md
  - type: static
    key: examples
    path: examples.md
  - type: docs
    key: trigger_docs
    urls:
      - https://docs.suprsend.com/docs/trigger-workflow.md
  - type: docs
    key: design_docs
    urls:
      - https://docs.suprsend.com/docs/design-workflow.md

references:
  - filename: nodes-reference.md
    template: partials/nodes-reference.hbs
  - filename: api-payloads.md

scripts:
  - filename: trigger-workflow.sh

assets:
  - filename: workflow-template.json
