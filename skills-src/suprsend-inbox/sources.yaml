name: suprsend-inbox
description: >
  SuprSend In-App Inbox integration guide for AI agents. Use when adding
  in-app notification inbox to web or mobile apps using SuprSend React SDK,
  React Native, Flutter, or other supported frameworks.
license: MIT
metadata:
  author: suprsend
  version: "1.0"
  category: inbox
  platform: web

sources:
  - type: static
    key: overview
    path: overview.md
  - type: static
    key: integration_guide
    path: integration-guide.md
  - type: docs
    key: inbox_docs
    urls:
      - https://docs.suprsend.com/docs/inbox-quick-start.md
    selector: "# Inbox"
  - type: docs
    key: react_sdk_docs
    urls:
      - https://docs.suprsend.com/docs/react-sdk.md
    selector: "# SDK Integration"

references:
  - filename: component-props.md
    template: partials/component-props.hbs
  - filename: customization-guide.md

scripts:
  - filename: check-inbox-setup.sh

assets:
  - filename: inbox-config.json
