      - find: '**Large Icon** - shown to the right of the notification text. Defaults to your organisation logo (set in Organisation Settings). Cannot be changed per template.'
        replace: '**Large Icon** (`icon_url`) - shown to the right of the notification text. Set per template variant. If `icon_url` is omitted it is saved empty and no icon is sent, so set it explicitly (for example `{{{$tenant.logo}}}` for the tenant logo).'
      - find: 'The large icon defaults to your organisation logo set in **Organisation Settings** on the SuprSend dashboard. It cannot be changed per template - update it in your org settings if you need a different icon.'
        replace: 'Set `icon_url` on the template variant to any public image URL, or to `{{{$tenant.logo}}}` for the tenant logo. It is per variant, so tenant or locale variants can use different icons. If `icon_url` is omitted it is saved empty and no icon is sent.'

